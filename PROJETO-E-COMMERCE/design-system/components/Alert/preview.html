<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"></head><body style="margin:0"><div class="us-root" style="padding:20px;background:var(--background)"><div class="us-stack"><div class="us-alert us-alert--error" role="alert"><i class="bx bx-error-circle" aria-hidden="true"></i><div><span class="us-alert__title">Login ou senha inválidos</span>Confira os dados ou <a class="us-link" href="#">recupere sua senha</a>.</div></div><div class="us-alert us-alert--success" role="status"><i class="bx bx-check-circle" aria-hidden="true"></i><div><span class="us-alert__title">Endereço salvo</span>Ele já aparece na etapa de entrega do checkout.</div></div><div class="us-alert us-alert--warning" role="status"><i class="bx bx-time-five" aria-hidden="true"></i><div><span class="us-alert__title">Sua sessão expirou</span>Entre novamente para continuar de onde parou.</div></div><div class="us-alert us-alert--info" role="status"><i class="bx bx-info-circle" aria-hidden="true"></i><div><span class="us-alert__title">Esta tela usa dados de demonstração</span>Pedidos e pagamentos ainda não estão ligados ao sistema.</div></div></div></div></body></html>
