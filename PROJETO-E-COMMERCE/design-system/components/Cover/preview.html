<!-- @dsCard height=300 -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .cover { position: relative; width: 960px; height: 300px; background: var(--background); overflow: hidden; font-family: var(--font-sans); }
  .cover svg { position: absolute; inset: 0; }
  .navy9 { fill: var(--navy-900); } .navy7 { fill: var(--navy-700); } .orange7 { fill: var(--orange-700); }
  .orange5 { fill: var(--orange-500); } .tint { fill: var(--navy-100); }
  .r-sm { rx: var(--radius-sm); } .r-md { rx: var(--radius-md); } .r-lg { rx: var(--radius-lg); }
  .txt { position: absolute; left: 40px; bottom: 40px; max-width: 440px; }
  .name { margin: 0; font-size: 72px; line-height: .95; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
  .tag { margin: 12px 0 0; font-size: 14px; line-height: 20px; color: var(--text-muted); }
</style></head>
<body>
<div class="cover">
  <!--
    blocos: navy-900 288×300 (laje principal, sangra topo e base) · orange-700 176×136 r=radius-lg · navy-700 176×148 r=radius-lg · navy-100 tira 176×8 entre eles
    arranjo: uma laje alta com dois satélites empilhados à direita, todos depois de x=480
    padrão: "geométrico, modular, UI densa" — prateleira de 3×4 ladrilhos navy-700 cortados por radius-sm, um em orange-500: o item escolhido na vitrine de uma loja de utilidades
    escalas: passo space-4 (16) entre ladrilhos e blocos, ladrilho 64×48, margem space-5 (24); raios radius-sm, radius-lg
  -->
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <rect class="navy9" x="480" y="0" width="288" height="300"/>
    <rect class="orange7 r-lg" x="784" y="-22" width="198" height="158"/>
    <rect class="navy7 r-lg" x="784" y="152" width="198" height="170"/>
    <rect class="tint" x="784" y="140" width="176" height="8"/>
    <g>
      <rect class="navy7 r-sm" x="504" y="24" width="64" height="48"/><rect class="navy7 r-sm" x="584" y="24" width="64" height="48"/><rect class="navy7 r-sm" x="664" y="24" width="80" height="48"/>
      <rect class="navy7 r-sm" x="504" y="88" width="144" height="48"/><rect class="orange5 r-sm" x="664" y="88" width="80" height="48"/>
      <rect class="navy7 r-sm" x="504" y="152" width="64" height="48"/><rect class="navy7 r-sm" x="584" y="152" width="64" height="48"/><rect class="navy7 r-sm" x="664" y="152" width="80" height="48"/>
      <rect class="navy7 r-sm" x="504" y="216" width="64" height="48"/><rect class="navy7 r-sm" x="584" y="216" width="160" height="48"/>
    </g>
  </svg>
  <div class="txt">
    <p class="name">UtiliStore</p>
    <p class="tag">Utilidades para a casa, com confiança e sem complicação.</p>
  </div>
</div>
</body></html>
