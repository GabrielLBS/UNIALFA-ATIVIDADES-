<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"></head><body style="margin:0"><div class="us-root" style="padding:20px;background:var(--background)"><div class="us-row" style="align-items:flex-start;gap:40px"><div class="us-stack" style="gap:8px"><span class="us-state-label">Spinner</span><div role="status" class="us-row"><span class="us-spinner us-spinner--lg" aria-hidden="true"></span><span>Carregando pedidos…</span></div></div><div class="us-stack" style="gap:8px;width:280px"><span class="us-state-label">Skeleton de lista</span><div aria-busy="true" class="us-stack" style="gap:10px"><div class="us-skeleton" style="height:18px"></div><div class="us-skeleton" style="height:18px;width:80%"></div><div class="us-skeleton" style="height:18px;width:60%"></div><span class="us-sr-only">Carregando</span></div></div><div class="us-stack" style="gap:8px"><span class="us-state-label">Botão carregando</span><button class="us-btn us-btn--primary is-loading" aria-busy="true"><span class="us-spinner" aria-hidden="true"></span>Entrando…</button></div></div><p class="us-help" style="margin-top:16px">Com “reduzir movimento” ativado no sistema, as animações param e o texto continua informando o estado.</p></div></body></html>
