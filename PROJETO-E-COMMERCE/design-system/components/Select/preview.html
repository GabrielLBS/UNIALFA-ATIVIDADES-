<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"></head><body style="margin:0"><div class="us-root" style="padding:20px;background:var(--background)"><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 16px;align-items:start"><div class="us-stack" style="gap:8px"><span class="us-state-label">Normal</span><div class="us-field"><label class="us-label" for="s1">Ordenar por</label><select class="us-select" id="s1"><option>Mais relevantes</option><option>Menor preço</option><option>Maior preço</option><option>Mais bem avaliados</option></select></div></div><div class="us-stack" style="gap:8px"><span class="us-state-label">Hover</span><div class="us-field"><label class="us-label" for="s2">Ordenar por</label><select class="us-select is-hover" id="s2"><option>Mais relevantes</option><option>Menor preço</option><option>Maior preço</option><option>Mais bem avaliados</option></select></div></div><div class="us-stack" style="gap:8px"><span class="us-state-label">Focus</span><div class="us-field"><label class="us-label" for="s3">Ordenar por</label><select class="us-select is-focus" id="s3"><option>Mais relevantes</option><option>Menor preço</option><option>Maior preço</option><option>Mais bem avaliados</option></select></div></div><div class="us-stack" style="gap:8px"><span class="us-state-label">Active</span><div class="us-field"><label class="us-label" for="s4">UF</label><select class="us-select" id="s4"><option value="">Selecione</option><option selected>GO</option><option>DF</option><option>SP</option></select></div></div><div class="us-stack" style="gap:8px"><span class="us-state-label">Disabled</span><div class="us-field"><label class="us-label" for="s5">Forma de pagamento</label><select class="us-select" id="s5" disabled><option>Indisponível nesta demonstração</option></select></div></div><div class="us-stack" style="gap:8px"><span class="us-state-label">Loading</span><div class="us-field"><label class="us-label" for="s6">Categoria</label><select class="us-select" id="s6" aria-busy="true" disabled><option>Carregando categorias…</option></select></div></div><div class="us-stack" style="gap:8px"><span class="us-state-label">Error</span><div class="us-field"><label class="us-label" for="s7">UF</label><select class="us-select is-error" id="s7" aria-invalid="true" aria-describedby="s7-h"><option>Selecione</option></select><p class="us-help us-help--error" id="s7-h"><i class="bx bx-error-circle" aria-hidden="true"></i>Escolha a UF.</p></div></div><div class="us-stack" style="gap:8px"><span class="us-state-label">Success</span><div class="us-field"><label class="us-label" for="s8">UF</label><select class="us-select is-success" id="s8"><option value="">Selecione</option><option selected>GO</option><option>DF</option><option>SP</option></select></div></div></div></div></body></html>
