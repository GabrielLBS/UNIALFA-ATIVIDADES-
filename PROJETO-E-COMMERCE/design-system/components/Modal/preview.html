<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"></head><body style="margin:0"><div class="us-root" style="padding:20px;background:var(--background)"><div class="us-overlay" style="border-radius:14px;padding:28px"><div class="us-modal" role="dialog" aria-modal="true" aria-labelledby="m-t" aria-describedby="m-d"><div class="us-modal__head"><h2 class="us-modal__title" id="m-t">Excluir sua conta?</h2><button class="us-icon-btn" aria-label="Fechar"><i class="bx bx-x" aria-hidden="true"></i></button></div><p id="m-d" style="margin:0;color:var(--text-muted);font-size:15px">Seus dados e endereços salvos serão apagados. Essa ação não pode ser desfeita.</p><div class="us-field"><label class="us-label" for="mp">Digite sua senha para confirmar</label><input class="us-input" id="mp" type="password" autocomplete="current-password"></div><div class="us-modal__actions"><button class="us-btn us-btn--secondary">Cancelar</button><button class="us-btn us-btn--danger"><i class="bx bx-trash" aria-hidden="true"></i>Excluir conta</button></div></div></div></div></body></html>
