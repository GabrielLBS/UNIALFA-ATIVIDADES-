<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"></head><body style="margin:0"><div class="us-root" style="padding:20px;background:var(--background)"><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 16px;align-items:start"><div class="us-stack" style="gap:8px"><span class="us-state-label">Normal</span><div class="us-field"><label class="us-label" for="i1">E-mail ou telefone</label><input class="us-input" id="i1" placeholder="seuemail@exemplo.com" aria-describedby="i1-h"><p class="us-help " id="i1-h">Use o e-mail ou o celular com DDD.</p></div></div><div class="us-stack" style="gap:8px"><span class="us-state-label">Hover</span><div class="us-field"><label class="us-label" for="i2">E-mail ou telefone</label><input class="us-input is-hover" id="i2" placeholder="seuemail@exemplo.com"></div></div><div class="us-stack" style="gap:8px"><span class="us-state-label">Focus</span><div class="us-field"><label class="us-label" for="i3">E-mail ou telefone</label><input class="us-input is-focus" id="i3" value="mariana@"></div></div><div class="us-stack" style="gap:8px"><span class="us-state-label">Active (preenchido)</span><div class="us-field"><label class="us-label" for="i4">E-mail ou telefone</label><input class="us-input" id="i4" value="62999999999"></div></div><div class="us-stack" style="gap:8px"><span class="us-state-label">Disabled</span><div class="us-field"><label class="us-label" for="i5">E-mail</label><input class="us-input" id="i5" value="cliente@utilistore.com" disabled><p class="us-help " id="i5-h">O e-mail não pode ser alterado aqui.</p></div></div><div class="us-stack" style="gap:8px"><span class="us-state-label">Loading</span><div class="us-field"><label class="us-label" for="i6">CEP</label><div class="us-input-wrap"><input class="us-input" id="i6" value="74000-000" aria-busy="true"><span class="us-input-status" style="color:var(--navy-700)"><span class="us-spinner" aria-hidden="true"></span></span></div><p class="us-help " id="i6-h">Buscando endereço…</p></div></div><div class="us-stack" style="gap:8px"><span class="us-state-label">Error</span><div class="us-field"><label class="us-label" for="i7">Senha</label><input class="us-input is-error" id="i7" type="password" value="1234" aria-invalid="true" aria-describedby="i7-h"><p class="us-help us-help--error" id="i7-h"><i class="bx bx-error-circle" aria-hidden="true"></i>A senha precisa ter pelo menos 6 caracteres.</p></div></div><div class="us-stack" style="gap:8px"><span class="us-state-label">Success</span><div class="us-field"><label class="us-label" for="i8">Confirmar senha</label><input class="us-input is-success" id="i8" type="password" value="123456" aria-describedby="i8-h"><p class="us-help us-help--success" id="i8-h"><i class="bx bx-check-circle" aria-hidden="true"></i>As senhas coincidem.</p></div></div></div><div style="max-width:320px;margin-top:24px"><div class="us-stack" style="gap:8px"><span class="us-state-label">Com mostrar/ocultar senha</span><div class="us-field"><label class="us-label" for="pw">Senha</label><div class="us-input-wrap"><input class="us-input" id="pw" type="password" value="minhasenha"><button class="us-icon-btn" type="button" aria-label="Mostrar senha" aria-pressed="false"><i class="bx bx-show" aria-hidden="true"></i></button></div><p class="us-help " id="pw-h">Mínimo de 6 caracteres.</p></div></div></div></div></body></html>
